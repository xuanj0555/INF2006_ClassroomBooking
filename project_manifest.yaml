data_ai:
  dataset: "data/README.md"
  cleaned_dataset: "data/reservations_cleaned_newversion.csv"
  notebook: "analytics/reservation_analysis.ipynb"
  dependencies: "analytics/requirements.txt"
  method: >-
    Descriptive historical reservation analytics: count reservations
    by room, weekday and start hour; calculate reserved hours and
    average and median reservation duration.
  evaluation: >-
    Validation procedures and observed results are documented in
    evidence/test-data-ai.md and analytics/README.md. Cloud delivery
    is documented separately in evidence/test-analytics-cloud.md.
  reproducible_command: >-
    cd analytics &&
    python -m jupyter nbconvert --to notebook --execute
    reservation_analysis.ipynb
    --output reservation_analysis.executed.ipynb
    --ExecutePreprocessor.timeout=600
  outputs:
    - "analytics/output/summary_metrics.json"
    - "analytics/output/reservations_by_room.csv"
    - "analytics/output/reservations_by_weekday.csv"
    - "analytics/output/reservations_by_start_hour.csv"
  limitations: >-
    Historical analytics are separate from live DynamoDB bookings.
    The feature does not predict no-shows or future demand.
    Reservations do not establish actual attendance or occupancy.
    Utilisation cannot be calculated without available-room-hour data.

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: >-
    Passwords, AWS access keys, session credentials and authentication
    tokens must not be committed or included in submission evidence.
    Cognito handles user passwords. Lambda accesses AWS resources
    through its execution role. Share test-account credentials
    privately and redact sensitive values from screenshots and logs.
  authentication: "Amazon Cognito with API Gateway JWT authorisation"
  authorisation: >-
    Backend administrator checks protect room-management operations.
    Booking cancellation requires organiser or administrator permission.
  iam_record: "src/infrastructure/iam-access.md"
  limitation: >-
    The prototype uses the AWS Academy LabRole. Restricted IAM policy
    inspection prevents a complete verification of its permission
    scope; this project does not claim verified least-privilege IAM.

run:
  prerequisites:
    - "Python 3 installed and available as python, python3 or py"
    - "Repository downloaded with src/frontend present"
    - "Internet connectivity and an available AWS backend"
    - "A valid Cognito test account mapped to a Roomly user"
    - "Use http://127.0.0.1:8766/ for the configured login callback"
    - "Run frontend commands from the repository root"
    - "Analytics reproduction requires dependencies and a Jupyter kernel"
  commands:
    - "python -m http.server 8766 --bind 127.0.0.1 --directory src/frontend"
  platform_commands:
    macos: "python3 -m http.server 8766 --bind 127.0.0.1 --directory src/frontend"
    windows: "py -m http.server 8766 --bind 127.0.0.1 --directory src/frontend"
  website_url: "http://127.0.0.1:8766/"
  user_guide: "USER_GUIDE.md"
  infrastructure_entry_point: "src/infrastructure/README.md"
  analytics_instructions: "analytics/README.md"


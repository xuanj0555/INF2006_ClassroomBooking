architecture:
  diagram: "evidence/architecture.png"
  service_model: >-
    Serverless backend using AWS Lambda, with managed API,
    authentication, database, object storage and logging services.
  deployment_model: >-
    AWS public-cloud backend in us-east-1, deployed within an AWS
    Academy lab account. The frontend is served locally on each
    user's computer and connects to the shared AWS backend.
  components:
    - name: "Roomly frontend"
      technology: "HTML, CSS and JavaScript"
      source: "src/frontend/"
      purpose: "Booking interface and Cognito sign-in integration"
      hosting: "Local HTTP server at http://127.0.0.1:8766/"

    - name: "Amazon Cognito"
      purpose: "Authenticate application users"
      app_client: "roomly-web"
      configuration: "src/infrastructure/cognito-config.md"

    - name: "Amazon API Gateway"
      api_name: "roomly-api"
      api_type: "HTTP API"
      purpose: "Route requests and validate tokens on protected routes"
      configuration: "src/infrastructure/api-gateway-config.md"

    - name: "Booking Lambda"
      function_name: "roomly-booking-api"
      purpose: "Session, booking and administrator operations"
      source: "src/backend/lambda_handler.py"
      data_access_source: "src/backend/dynamodbService.py"
      configuration: "src/infrastructure/lambda_config.md"

    - name: "Analytics Lambda"
      function_name: "roomly-get-analytics"
      purpose: "Read historical analytics outputs from S3"
      source: "src/backend/analytics_lambda.py"
      configuration: "src/infrastructure/lambda_config.md"

    - name: "Amazon DynamoDB"
      purpose: "Store rooms, users, bookings and reservation locks"
      tables:
        - "Rooms"
        - "RoomlyUsers"
        - "RoomlyBookings"
        - "RoomlyReservations"
      configuration: "src/infrastructure/dynamodb-schema.md"

    - name: "Amazon S3"
      bucket_name: "roomly-analytics-2026-11"
      purpose: "Store historical analytics output files"
      configuration: "src/infrastructure/s3-config.md"

    - name: "Amazon CloudWatch"
      purpose: "Record Lambda execution information and API access logs"
      evidence: "evidence/monitoring.md"


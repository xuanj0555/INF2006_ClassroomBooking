project:
  group_id: "P2-GROUP-01"
  title: "Roomly – Campus Room Booking Service"
  problem_statement: "Roomly provides a secure cloud-based campus room booking service that allows users to view room availability, make participant-aware bookings, cancel bookings and use historical reservation-demand analytics to understand room usage patterns."
  cloud_provider: "AWS"
  repository_commit: ""


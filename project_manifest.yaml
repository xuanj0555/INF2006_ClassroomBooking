project:
  group_id: "INF2006_11"
  title: "Roomly: Campus Room Booking with Historical Reservation Analytics"
  problem_statement: >-
    Provide authenticated campus room booking, shared availability,
    booking cancellation, attendance recording and administrator room
    management. Analyse historical reservation patterns to support
    understanding of room demand and reservation duration.
  cloud_provider: "AWS"
  repository_commit: "" # Enter the final submitted commit hash, if applicable.


  members:
    - name: "TEO XUE LING, SHARLENE"
      student_id: "2503489"
      role: "Member 1 — Frontend development and user interface"

    - name: "SU YING, STANBERLEY "
      student_id: "2501376"
      role: "Member 2 — Backend booking logic and data consistency"

    - name: "SHERMAINE CHAN JING XUAN"

architecture:
  diagram: "evidence/architecture.png"

evidence:
  functional_test: "evidence/test-functional.md"
  security_test: "evidence/test-security.md"
  data_ai_test: "evidence/test-data-ai.md"
  scale_resilience_test: "evidence/test-resilience.md"

data_ai:
  dataset: "data/README.md"
  method: "Descriptive analysis of historical room reservation data using Python, pandas and Jupyter. The analysis examines reservation counts by room, weekday and start hour, total reserved hours, and reservation duration statistics."
  evaluation: "The cleaned dataset contains 51,319 reservation records and 46 room identifiers. Validation checks confirm that grouped reservation counts by room, weekday and start hour sum to 51,319. Reservation-duration calculations and exported analytical outputs are also checked."
  reproducible_command: "Create a Python virtual environment, install the dependencies from analytics/requirements.txt, open analytics/reservation_analysis.ipynb and run all cells from top to bottom."

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: "Authentication is handled through Amazon Cognito and protected API routes use JWT-based authorization. AWS service access uses Lambda execution roles rather than storing AWS access keys in source code. Credentials, tokens and sensitive configuration values must not be included in the submission."

run:
  prerequisites:
    - "Python 3.12 or compatible Python version"
    - "pip"
    - "Jupyter or the VS Code Jupyter extension for analytics reproduction"
    - "Internet access for the deployed AWS service and Cognito authentication"
    - "AWS credentials are required only for operations that directly access AWS and are not included in the submission"

  commands:
    - "Run backend tests with: PYTHONPATH=src/backend:. python -m unittest tests.test_backend tests.test_admin tests.test_dynamodb_service -q"
    - "On Windows PowerShell, set the backend path with: $env:PYTHONPATH='src/backend;.'"
    - "Run the local frontend with: py -m http.server 8766 --bind 127.0.0.1 --directory src/frontend"
    - "Open the local frontend at: http://127.0.0.1:8766/"
    - "Install analytics dependencies with: python -m pip install -r analytics/requirements.txt"
    - "Run all cells in analytics/reservation_analysis.ipynb from top to bottom"

declarations:
  ai_use: "AI_USE_DECLARATION.md"
  contributions: "TEAM_CONTRIBUTIONS.md"